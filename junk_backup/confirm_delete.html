{% extends 'dashboard/base_dashboard.html' %}

{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<div style="background-color: var(--card-bg); padding: 30px; border-radius: 8px; max-width: 600px; text-align: center;">
    <h3 style="margin-bottom: 20px;">¿Estás seguro que deseas eliminar "{{ object }}"?</h3>
    <p style="color: var(--text-muted); margin-bottom: 30px;">Esta acción no se puede deshacer.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn" style="background-color: #ff4444; color: white;">Sí, Eliminar</button>
        <a href="javascript:history.back()" class="btn" style="margin-left: 10px; background-color: transparent; border: 1px solid var(--border-color);">Cancelar</a>
    </form>
</div>
{% endblock %}
