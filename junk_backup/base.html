<!DOCTYPE html>
<html lang="es-mx">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SCW - Super Championship Wrestling{% endblock %}</title>
    <meta name="description" content="Sitio oficial de Lucha Libre SCW. Eventos, roster, escuela y tienda.">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="main-header">
        <div class="logo">
            <a href="{% url 'home' %}"><h1>SCW</h1></a>
        </div>
        <nav class="main-nav">
            <button class="hamburger-menu" id="hamburgerMenu" aria-label="Abrir menú">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
            <ul class="nav-links" id="navLinks">
                <li><a href="{% url 'home' %}">Inicio</a></li>
                <li><a href="#">Roster</a></li>
                <li><a href="#">Próximos Eventos</a></li>
                <li><a href="#">Escuela</a></li>
                <li><a href="#">Tienda</a></li>
                <li><a href="#">PPV / Petriun</a></li>
            </ul>
        </nav>
    </header>

    <main class="content">
        {% block content %}
        {% endblock content %}
    </main>

    <footer class="main-footer">
        <p>&copy; {% now "Y" %} SCW Lucha Libre. Todos los derechos reservados.</p>
    </footer>

    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
